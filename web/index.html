<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123447"><title>كنوز | KENOZ</title>
<style>
:root{--navy:#123447;--gold:#c4a15a;--paper:#faf8f2;--ink:#1e2930;--muted:#667780}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Naskh Arabic",Tahoma,sans-serif}header{background:var(--navy);color:white;padding:20px 16px 18px;position:sticky;top:0;z-index:2}h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#e3eaf0;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px}.search{width:100%;padding:13px 15px;border:1px solid #d9d5ca;border-radius:14px;background:white;font:inherit;margin-bottom:14px}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.section{border:1px solid #e1ddd2;border-radius:14px;padding:15px;background:white;text-align:right;font:inherit;color:var(--ink);min-height:68px}.section:active{background:#f0eadb}.section b{display:block}.section small{color:var(--muted)}.panel{margin-top:16px;background:white;border:1px solid #e1ddd2;border-radius:14px;padding:18px;line-height:2}.panel h2{margin-top:0;color:var(--navy)}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.notice{color:var(--muted);font-size:13px;line-height:1.8}.back{border:0;background:transparent;color:white;font:inherit;margin-left:10px}.hidden{display:none}.status{color:var(--gold);font-size:12px;margin-top:10px}@media(min-width:600px){.sections{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><header><h1>✥ كنوز KENOZ</h1><p>مكتبتك الكنسية — قراءة محلية دون إنترنت</p><div id="status" class="status">تحميل الفهرس المحلي…</div></header>
<main class="wrap"><input id="search" class="search" placeholder="ابحث في النصوص المحمّلة…" aria-label="بحث">
<div id="sections" class="sections"></div><section id="reader" class="panel hidden"><button id="back" class="back" style="color:#123447">← رجوع للأقسام</button><div id="results"></div></section><p class="notice">المحتوى الظاهر هو فقط النصوص المضمّنة فعليًا في الحزمة. أضيفوا النصوص الكاملة من مصادر موثوقة ومصرّح باستخدامها قبل إصدار النسخة النهائية.</p></main>
<script>
const $=s=>document.querySelector(s);let catalog=null,items=[],current=null;
async function readJson(path){const r=await fetch(path);if(!r.ok)throw Error('تعذر تحميل '+path);return r.json()}
async function init(){try{catalog=await readJson('content/catalog.json');const data=await readJson('content/sample.json');items=data.items||[];$('#sections').innerHTML=catalog.sections.map(s=>'<button class="section" data-id="'+s.id+'"><b>'+s.title+'</b><small>فتح القسم</small></button>').join('');$('#sections').querySelectorAll('button').forEach(b=>b.onclick=()=>openSection(b.dataset.id));$('#status').textContent='الفهرس المحلي جاهز • '+catalog.sections.length+' أقسام';$('#search').addEventListener('input',search); }catch(e){$('#status').textContent='تعذر قراءة الملفات المحلية: '+e.message;}}
function openSection(id){current=id;const s=catalog.sections.find(x=>x.id===id);$('#reader').classList.remove('hidden');$('#sections').classList.add('hidden');$('#results').innerHTML='<h2>'+s.title+'</h2>'+items.filter(x=>x.section===id||x.section==='general').map(x=>'<article class="item"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div></article>').join('')+'<p class="notice">سيظهر هنا المحتوى الكامل بعد استيراده في ملف JSON الخاص بالقسم.</p>';}
function search(){const q=$('#search').value.trim().toLowerCase();if(!q)return;const found=items.filter(x=>(x.title+' '+x.text).toLowerCase().includes(q));$('#reader').classList.remove('hidden');$('#sections').classList.add('hidden');$('#results').innerHTML='<h2>نتائج البحث</h2>'+(found.length?found.map(x=>'<article class="item"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div></article>').join(''):'<p>لا توجد نتائج ضمن النصوص المحمّلة حاليًا.</p>');}
$('#back').onclick=()=>{$('#reader').classList.add('hidden');$('#sections').classList.remove('hidden')};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
